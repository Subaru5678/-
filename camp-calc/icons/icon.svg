<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c3122"/>
      <stop offset="1" stop-color="#101c14"/>
    </linearGradient>
    <linearGradient id="tent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0a862"/>
      <stop offset="1" stop-color="#d98b3f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#4a8f5c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4a8f5c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="512" height="512" rx="104"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="200" r="230" fill="url(#glow)"/>

    <polygon points="256,150 380,380 132,380" fill="url(#tent)"/>
    <polygon points="256,150 256,380 132,380" fill="#c9762f" opacity="0.6"/>
    <polygon points="256,240 300,380 212,380" fill="#101c14"/>

    <line x1="90" y1="380" x2="422" y2="380" stroke="#4a8f5c" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
