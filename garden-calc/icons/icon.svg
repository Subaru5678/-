<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243620"/>
      <stop offset="1" stop-color="#131c10"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fc95c"/>
      <stop offset="1" stop-color="#5a9e3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#5a9e3d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5a9e3d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="512" height="512" rx="104"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="230" r="230" fill="url(#glow)"/>

    <!-- sprout -->
    <path d="M256 380 V220" stroke="url(#leaf)" stroke-width="18" stroke-linecap="round"/>
    <path d="M256 260 C190 260 160 210 160 160 C230 160 256 200 256 260 Z" fill="url(#leaf)"/>
    <path d="M256 230 C322 230 352 180 352 130 C282 130 256 170 256 230 Z" fill="url(#leaf)"/>
    <ellipse cx="256" cy="392" rx="70" ry="20" fill="#a56b3a"/>

    <circle cx="368" cy="360" r="44" fill="#c9a13f"/>
    <circle cx="368" cy="360" r="44" fill="none" stroke="#131c10" stroke-width="8"/>
  </g>
</svg>
