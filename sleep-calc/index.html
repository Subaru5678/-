<style>
:root{
  --bg:#eef0f8; --panel:#ffffff; --panel2:#e2e5f4; --line:#d3d7ec;
  --ink:#1c1f33; --muted:#6c7190; --label:#2f334d; --accent:#5a6bd9; --accent2:#9a5ad9;
  --ok:#4d9a53; --warn:#b3821f; --bad:#c9483f;
  --tool-color:#5a6bd9;
  --font-display:'Oswald','Zen Kaku Gothic New',sans-serif;
  color-scheme:light;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; margin:0; background:var(--bg); color:var(--ink);
  font-family:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;
  overscroll-behavior:none; -webkit-text-size-adjust:100%; }
body{
  background-image:
    linear-gradient(var(--bg), var(--bg)),
    radial-gradient(rgba(90,107,217,.1) 1.6px, transparent 1.6px);
  background-size:auto, 24px 24px;
}
button{ font-family:inherit; color:inherit; border:0; cursor:pointer; background:none; }
input,select{ font-family:inherit; }
#app{ display:flex; flex-direction:column; min-height:100%; max-width:640px; margin:0 auto;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }

#topbar{ display:flex; align-items:center; gap:10px; padding:16px 16px 10px; flex:none; }
#topbar h1{ font-family:var(--font-display); font-size:19px; margin:0; flex:1; font-weight:600; letter-spacing:.03em; }
#topbar .ic-btn{ width:38px; height:38px; border-radius:11px; background:var(--panel); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:17px; flex:none;
  box-shadow:0 2px 0 rgba(0,0,0,.1); transition:transform .12s, box-shadow .12s; }
#topbar .ic-btn:active{ transform:translateY(2px); box-shadow:none; }
#topbar #backBtn{ display:none; }
#topbar #backBtn.show{ display:flex; }

main{ flex:1; padding:4px 16px 24px; overflow-y:auto; -webkit-overflow-scrolling:touch; }

.hero{ position:relative; overflow:hidden; background:linear-gradient(155deg, var(--panel) 0%, var(--panel2) 100%);
  border:1px solid var(--line); border-radius:18px; padding:20px 18px; margin-bottom:20px; }
.hero::before{ content:''; position:absolute; inset:0; pointer-events:none;
  background-image:repeating-linear-gradient(45deg, rgba(90,107,217,.08) 0 2px, transparent 2px 14px); }
.hero .kicker{ display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:800; letter-spacing:.08em;
  color:var(--accent); margin-bottom:8px; }
.hero .kicker::before{ content:''; width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); }
.hero h2{ font-family:var(--font-display); font-size:22px; line-height:1.3; margin:0 0 8px; font-weight:700; letter-spacing:.01em; position:relative; }
.hero p{ margin:0; color:var(--muted); font-size:13px; line-height:1.7; position:relative; max-width:46ch; }
.hero b{ color:var(--ink); font-weight:800; }

.grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.card{ position:relative; background:var(--panel); border:1px solid var(--line); border-radius:14px;
  padding:16px 13px 14px; text-align:left; display:flex; flex-direction:column; gap:8px; min-height:104px;
  overflow:hidden; transition:transform .12s, border-color .12s, background .12s; }
.card::before{ content:''; position:absolute; left:0; top:0; right:0; height:3px; background:var(--card-color,var(--accent)); }
.card:active{ transform:translateY(2px) scale(.99); background:var(--panel2); }
.card .icon-badge{ width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  font-size:18px; background:color-mix(in srgb, var(--card-color,var(--accent)) 18%, transparent);
  color:var(--card-color,var(--accent)); border:1px solid color-mix(in srgb, var(--card-color,var(--accent)) 40%, transparent); }
.card .name{ font-weight:900; font-size:14px; line-height:1.3; }
.card .desc{ font-size:11px; color:var(--muted); line-height:1.4; }

.section-title{ display:flex; align-items:center; gap:8px; font-size:12px; font-weight:900; color:var(--muted); margin:22px 0 10px; letter-spacing:.08em; }
.section-title::after{ content:''; flex:1; height:1px; background:var(--line); }

.tool-head{ display:flex; align-items:center; gap:12px; margin:6px 0 18px; padding-bottom:16px; border-bottom:1px solid var(--line); }
.tool-head .icon-badge{ width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center;
  font-size:24px; flex:none; background:color-mix(in srgb, var(--tool-color) 18%, transparent);
  color:var(--tool-color); border:1px solid color-mix(in srgb, var(--tool-color) 40%, transparent);
  box-shadow:0 0 20px -4px color-mix(in srgb, var(--tool-color) 50%, transparent); }
.tool-head h2{ font-family:var(--font-display); font-size:17px; margin:0; font-weight:600; letter-spacing:.02em; }
.tool-head .sub{ font-size:12px; color:var(--muted); margin-top:3px; }

.field{ margin-bottom:14px; }
.field label{ display:block; font-size:13px; color:var(--label); font-weight:800; margin-bottom:6px; }
.field .row{ display:flex; gap:8px; align-items:center; }
.field input[type=number], .field input[type=text], .field input[type=time], .field select{ width:100%; background:var(--panel); border:1px solid var(--line);
  color:var(--ink); border-radius:10px; padding:12px; font-size:15px; font-weight:700;
  font-variant-numeric:tabular-nums; transition:border-color .12s, box-shadow .12s; color-scheme:light; }
.field input:focus, .field select:focus{ outline:none; border-color:var(--tool-color); box-shadow:0 0 0 3px color-mix(in srgb, var(--tool-color) 22%, transparent); }
.unit{ font-size:12px; color:var(--label); font-weight:800; white-space:nowrap; }
.hint{ font-size:11px; color:var(--muted); margin-top:6px; line-height:1.6; }

.toggle-row{ display:flex; gap:8px; flex-wrap:wrap; }
.toggle{ padding:9px 13px; border-radius:10px; background:var(--panel); border:1px solid var(--line);
  font-size:12px; font-weight:800; color:var(--label); transition:transform .1s; }
.toggle.active{ background:var(--tool-color); color:#fff; border-color:var(--tool-color); }
.toggle:active{ transform:scale(.97); }

.result-box{ position:relative; background:linear-gradient(155deg, var(--panel2), var(--panel));
  border:1px solid color-mix(in srgb, var(--tool-color) 45%, var(--line)); border-radius:16px;
  padding:18px; margin-top:8px; overflow:hidden; box-shadow:0 12px 28px -16px color-mix(in srgb, var(--tool-color) 55%, transparent); }
.result-box::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--tool-color); }
.result-box .r-main{ font-family:var(--font-display); font-size:28px; font-weight:600;
  color:color-mix(in srgb, var(--tool-color) 55%, var(--ink)); letter-spacing:.01em; font-variant-numeric:tabular-nums; }
.result-box .r-label{ font-size:11px; color:var(--muted); font-weight:800; margin-bottom:3px; letter-spacing:.04em; }
.result-box .r-sub{ font-size:12px; color:var(--muted); margin-top:10px; line-height:1.7; }
.result-box .r-row{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px solid var(--line); font-size:13px; }
.result-box .r-row:first-of-type{ border-top:none; }
.result-box .r-row b{ font-variant-numeric:tabular-nums; }

.btn{ display:flex; align-items:center; justify-content:center; gap:6px; padding:13px; border-radius:12px; font-weight:900; font-size:13px; transition:transform .1s, box-shadow .1s; }
.btn-primary{ background:linear-gradient(155deg, color-mix(in srgb, var(--tool-color) 85%, white), var(--tool-color)); color:#fff; box-shadow:0 8px 18px -8px color-mix(in srgb, var(--tool-color) 70%, transparent); }
.btn-ghost{ background:var(--panel); border:1px solid var(--line); color:var(--ink); }
.btn:active{ transform:translateY(1px) scale(.98); }
.btn-row{ display:flex; gap:8px; margin-top:14px; }
.btn-row .btn{ flex:1; }

.saved-item{ position:relative; background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:13px 13px 13px 16px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:10px; overflow:hidden; }
.saved-item::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--item-color,var(--accent)); }
.saved-item .meta{ font-size:11px; color:var(--muted); margin-top:4px; font-variant-numeric:tabular-nums; }
.saved-item .del{ width:32px; height:32px; border-radius:9px; background:var(--panel2); border:1px solid var(--line); flex:none; }
.empty{ text-align:center; color:var(--muted); font-size:13px; padding:48px 20px; line-height:1.8; }

#adSlot{ flex:none; padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px)); }
#adSlot .ad-box{ background:var(--panel); border:1px dashed var(--line); border-radius:10px; height:50px;
  display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--muted); font-weight:700; }
#adSlot ins.adsbygoogle{ display:none; }

#toast{ position:fixed; left:50%; bottom:80px; transform:translate(-50%,10px); background:rgba(20,24,32,.95);
  color:#fff; backdrop-filter:blur(6px); border:1px solid var(--line); padding:11px 18px; border-radius:12px; font-weight:800;
  font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:20; max-width:80%; text-align:center; box-shadow:0 10px 24px -10px rgba(0,0,0,.35); }
#toast.show{ opacity:1; transform:translate(-50%,0); }

.view{ display:none; }
.view.active{ display:block; animation:viewIn .22s ease both; }
@keyframes viewIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce){ .view.active{ animation:none; } }
</style>

<body>
<div id="app">
  <div id="topbar">
    <button id="backBtn" class="ic-btn" aria-label="戻る">←</button>
    <h1 id="pageTitle">睡眠サイクル計算</h1>
    <button id="savedBtn" class="ic-btn" aria-label="保存した計算">📋</button>
  </div>

  <main id="main">
    <div id="view-home" class="view active">
      <div class="hero">
        <div class="kicker">SLEEP CALCULATOR</div>
        <h2>寝る時刻も起きる時刻も、その場で計算。</h2>
        <p>就寝・起床時刻の逆算・昼寝の最適な長さ・睡眠負債・時差ボケの調整日数・年齢別の推奨睡眠時間から、カフェインの残存量・画面をやめるべき時刻・睡眠効率まで。<b>快眠</b>のための計算ツールです。</p>
      </div>
      <div class="section-title">ツールを選ぶ</div>
      <div class="grid" id="toolGrid"></div>
      <div style="text-align:center; margin-top:24px;">
        <a href="privacy.html" style="font-size:11px; color:var(--muted);">プライバシーポリシー</a>
      </div>
    </div>

    <div id="view-tool" class="view"></div>

    <div id="view-saved" class="view">
      <div class="section-title">保存した計算</div>
      <div id="savedList"></div>
    </div>
  </main>

  <div id="adSlot">
    <div class="ad-box" id="adPlaceholder">広告スペース</div>
    <ins class="adsbygoogle" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
      data-ad-slot="0000000000" data-ad-format="auto" data-full-width-responsive="true" hidden></ins>
  </div>
  <div id="toast"></div>
</div>

<script>
(function(){
"use strict";

var $ = function(sel, ctx){ return (ctx||document).querySelector(sel); };
var $$ = function(sel, ctx){ return Array.prototype.slice.call((ctx||document).querySelectorAll(sel)); };
var ESC_MAP = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
var esc = function(s){ return String(s).replace(/[&<>"']/g, function(c){ return ESC_MAP[c]; }); };
var fmt = function(n, d){ d = d==null?2:d; if(!isFinite(n)) return "-";
  var v = Math.round(n * Math.pow(10,d)) / Math.pow(10,d);
  return v.toLocaleString('ja-JP', {maximumFractionDigits:d}); };
var toast = function(msg){
  var t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._h); toast._h = setTimeout(function(){ t.classList.remove('show'); }, 1800);
};
var uid = function(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); };

var STORE_KEY = 'sleepcalc.saved.v1';
var loadSaved = function(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }catch(e){ return []; } };
var writeSaved = function(list){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(list)); }catch(e){} };
var saveResult = function(toolId, toolName, summary){
  var list = loadSaved();
  list.unshift({ id: uid(), toolId: toolId, toolName: toolName, summary: summary, ts: Date.now() });
  if(list.length > 100) list = list.slice(0,100);
  writeSaved(list);
  toast('保存しました');
};
var shareText = function(text){
  if(navigator.share){ navigator.share({ text: text }).catch(function(){}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(text).then(function(){ toast('コピーしました'); }).catch(function(){ toast('コピーに失敗しました'); }); }
  else { toast('この端末では共有できません'); }
};

var state = { view:'home', toolId:null };
var showView = function(name){
  $$('.view').forEach(function(v){ v.classList.remove('active'); });
  $('#view-' + name).classList.add('active');
  $('#backBtn').classList.toggle('show', name !== 'home');
  $('#pageTitle').textContent = name === 'home' ? '睡眠サイクル計算' : (name === 'saved' ? '保存した計算' : (TOOLS[state.toolId] ? TOOLS[state.toolId].name : ''));
  window.scrollTo(0,0);
  $('#main').scrollTop = 0;
};
$('#backBtn').addEventListener('click', function(){ showView('home'); });
$('#savedBtn').addEventListener('click', function(){ renderSaved(); showView('saved'); });

var TOOLS = {};

function openTool(id){
  state.toolId = id;
  var tool = TOOLS[id];
  document.documentElement.style.setProperty('--tool-color', tool.color);
  var host = $('#view-tool');
  host.innerHTML = '';
  var head = document.createElement('div');
  head.className = 'tool-head';
  head.innerHTML = '<div class="icon-badge">' + tool.emoji + '</div><div><h2>' + tool.name + '</h2><div class="sub">' + tool.sub + '</div></div>';
  host.appendChild(head);
  var body = document.createElement('div');
  host.appendChild(body);
  tool.render(body);
  showView('tool');
}

function field(container, opts){
  var wrap = document.createElement('div'); wrap.className = 'field';
  var label = document.createElement('label'); label.textContent = opts.label; wrap.appendChild(label);
  var row = document.createElement('div'); row.className = 'row';
  var input = document.createElement('input');
  input.type = opts.type || 'number';
  if(input.type === 'number') input.inputMode = 'decimal';
  input.placeholder = opts.placeholder || '';
  if(opts.value != null) input.value = opts.value;
  if(opts.step) input.step = opts.step;
  if(input.type === 'number' && !opts.allowNegative) input.min = '0';
  row.appendChild(input);
  if(opts.unit){ var u = document.createElement('span'); u.className='unit'; u.textContent = opts.unit; row.appendChild(u); }
  wrap.appendChild(row);
  if(opts.hint){ var h = document.createElement('div'); h.className='hint'; h.textContent = opts.hint; wrap.appendChild(h); }
  container.appendChild(wrap);
  return input;
}

function toggleGroup(container, opts){
  var wrap = document.createElement('div'); wrap.className = 'field';
  if(opts.label){ var label = document.createElement('label'); label.textContent = opts.label; wrap.appendChild(label); }
  var row = document.createElement('div'); row.className = 'toggle-row';
  var current = { value: opts.value != null ? opts.value : opts.options[0].value };
  var btns = opts.options.map(function(o){
    var b = document.createElement('button'); b.type='button'; b.className='toggle'; b.textContent = o.label;
    if(o.value === current.value) b.classList.add('active');
    b.addEventListener('click', function(){
      current.value = o.value;
      btns.forEach(function(bb){ bb.classList.remove('active'); });
      b.classList.add('active');
      if(opts.onChange) opts.onChange(current.value);
    });
    row.appendChild(b);
    return b;
  });
  wrap.appendChild(row);
  container.appendChild(wrap);
  return current;
}

function resultBox(container){
  var box = document.createElement('div'); box.className = 'result-box';
  container.appendChild(box);
  return box;
}

function actionsRow(container, toolId, toolName, getSummary){
  var row = document.createElement('div'); row.className = 'btn-row';
  var saveBtn = document.createElement('button'); saveBtn.className='btn btn-primary'; saveBtn.textContent='この結果を保存';
  saveBtn.addEventListener('click', function(){ saveResult(toolId, toolName, getSummary()); });
  var shareBtn = document.createElement('button'); shareBtn.className='btn btn-ghost'; shareBtn.textContent='共有 / コピー';
  shareBtn.addEventListener('click', function(){ shareText(toolName + '\n' + getSummary()); });
  row.appendChild(saveBtn); row.appendChild(shareBtn);
  container.appendChild(row);
}

function parseTime(str){
  var m = /^(\d{1,2}):(\d{2})$/.exec(str||'');
  if(!m) return null;
  return (parseInt(m[1],10)*60 + parseInt(m[2],10)) % 1440;
}
function formatMinutes(mins){
  mins = ((mins % 1440) + 1440) % 1440;
  var h = Math.floor(mins/60), m = mins%60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}

/* ---------- 1. 就寝・起床時刻の逆算計算 ---------- */
TOOLS.cycle = {
  name:'就寝・起床時刻の逆算計算', emoji:'🌙', sub:'90分の睡眠サイクルから、最適な時刻を算出', color:'#5a6bd9',
  render: function(body){
    var dir = toggleGroup(body, { label:'計算方向', value:'frombed', options:[
      { value:'frombed', label:'就寝時刻から起床時刻を計算' },
      { value:'fromwake', label:'起床時刻から就寝時刻を計算' }
    ], onChange: function(){ calc(); } });
    var time = field(body, { label:'時刻', type:'time', value: '23:30' });
    var buffer = field(body, { label:'入眠までの時間', unit:'分', value:14, hint:'布団に入ってから眠りにつくまでの平均時間です。' });
    var box = resultBox(body);
    var actions = document.createElement('div'); body.appendChild(actions);

    function calc(){
      var t = parseTime(time.value);
      var buf = parseFloat(buffer.value)||0;
      if(t == null){ box.innerHTML = '<div class="r-sub">時刻を入力してください。</div>'; actions.innerHTML=''; return; }
      var cycles = [4,5,6];
      var rows, mainLabel, mainTime;
      if(dir.value === 'frombed'){
        var sleepStart = t + buf;
        rows = cycles.map(function(c){ return { c:c, time: formatMinutes(sleepStart + c*90), hours: c*1.5 }; });
        mainLabel = '起床のおすすめ時刻(5サイクル)';
        mainTime = formatMinutes(sleepStart + 5*90);
      } else {
        rows = cycles.map(function(c){ return { c:c, time: formatMinutes(t - c*90 - buf), hours: c*1.5 }; });
        mainLabel = '就寝のおすすめ時刻(5サイクル)';
        mainTime = formatMinutes(t - 5*90 - buf);
      }
      box.innerHTML = '<div class="r-label">' + mainLabel + '</div><div class="r-main">' + mainTime + '</div>' +
        rows.map(function(r){ return '<div class="r-row"><span>' + r.c + 'サイクル(' + fmt(r.hours,1) + '時間)</span><b>' + r.time + '</b></div>'; }).join('') +
        '<div class="r-sub">睡眠は約90分周期で浅い眠りと深い眠りを繰り返すとされ、周期の切れ目に近いタイミングで起きると目覚めやすいと言われています。</div>';
      actions.innerHTML = '';
      actionsRow(actions, 'cycle', TOOLS.cycle.name, function(){
        return (dir.value==='frombed'?'就寝'+time.value:'起床'+time.value) + ' → ' + rows.map(function(r){ return r.c+'ｻｲｸﾙ:'+r.time; }).join(' / ');
      });
    }
    [time, buffer].forEach(function(i){ i.addEventListener('input', calc); });
    calc();
  }
};

/* ---------- 2. 昼寝の最適な長さ計算 ---------- */
var NAP_TYPES = {
  power: { label:'パワーナップ', minutes:20, desc:'短時間で眠気をリセット。深い眠りに入る前に起きるため、すっきり目覚めやすいのが特徴です。' },
  full: { label:'フルサイクル', minutes:90, desc:'1サイクル分しっかり眠ることで、浅い眠りのタイミングで自然に目覚めやすくなります。' }
};
TOOLS.nap = {
  name:'昼寝の最適な長さ計算', emoji:'😴', sub:'仮眠の開始時刻とタイプから、起きる時刻を算出', color:'#e08a3f',
  render: function(body){
    var type = toggleGroup(body, { label:'仮眠のタイプ', value:'power', options: Object.keys(NAP_TYPES).map(function(k){ return { value:k, label:NAP_TYPES[k].label + '(' + NAP_TYPES[k].minutes + '分)' }; }), onChange: function(){ calc(); } });
    var start = field(body, { label:'仮眠を始める時刻', type:'time', value:'13:00' });
    var box = resultBox(body);
    var actions = document.createElement('div'); body.appendChild(actions);

    function calc(){
      var t = parseTime(start.value);
      var nap = NAP_TYPES[type.value];
      if(t == null){ box.innerHTML = '<div class="r-sub">時刻を入力してください。</div>'; actions.innerHTML=''; return; }
      var wake = formatMinutes(t + nap.minutes);
      box.innerHTML = '<div class="r-label">起きる目安の時刻</div><div class="r-main">' + wake + '</div>' +
        '<div class="r-row"><span>仮眠の長さ</span><b>' + nap.minutes + ' 分</b></div>' +
        '<div class="r-sub">' + nap.desc + ' 15時以降の仮眠は夜の睡眠に影響することがあるため、避けるのがおすすめです。</div>';
      actions.innerHTML = '';
      actionsRow(actions, 'nap', TOOLS.nap.name, function(){
        return nap.label+'('+nap.minutes+'分) '+start.value+'開始 → '+wake+'起き';
      });
    }
    start.addEventListener('input', calc);
    calc();
  }
};

/* ---------- 3. 睡眠負債の計算 ---------- */
TOOLS.debt = {
  name:'睡眠負債の計算', emoji:'📉', sub:'理想と実際の睡眠時間から、不足分を算出', color:'#c94f6a',
  render: function(body){
    var ideal = field(body, { label:'理想の睡眠時間', unit:'時間/日', value:7.5, step:'0.5' });
    var actual = field(body, { label:'実際の平均睡眠時間', unit:'時間/日', value:6, step:'0.5' });
    var days = field(body, { label:'対象日数', unit:'日', value:7 });
    var box = resultBox(body);
    var actions = document.createElement('div'); body.appendChild(actions);

    function calc(){
      var i = parseFloat(ideal.value)||0, a = parseFloat(actual.value)||0, d = parseFloat(days.value)||0;
      var debt = Math.max(0, (i - a) * d);
      var nights = i > 0 ? debt / i : 0;
      box.innerHTML = '<div class="r-label">睡眠負債(目安)</div><div class="r-main">約 ' + fmt(debt,1) + ' 時間</div>' +
        '<div class="r-row"><span>不足分を日数換算</span><b>約 ' + fmt(nights,1) + ' 日分</b></div>' +
        '<div class="r-sub">睡眠負債は少しずつ蓄積し、日中の眠気や集中力低下につながるとされています。休日の寝だめだけで解消するのは難しいため、平日から睡眠時間を見直すのがおすすめです。</div>';
      actions.innerHTML = '';
      actionsRow(actions, 'debt', TOOLS.debt.name, function(){
        return '理想'+i+'h 実際'+a+'h ×'+d+'日 → 睡眠負債 約'+fmt(debt,1)+'時間';
      });
    }
    [ideal, actual, days].forEach(function(i){ i.addEventListener('input', calc); });
    calc();
  }
};

/* ---------- 4. 時差ボケ調整日数の計算 ---------- */
TOOLS.jetlag = {
  name:'時差ボケ調整日数の計算', emoji:'✈️', sub:'時差と方向から、体内時計が慣れるまでの日数を算出', color:'#3f9ecf',
  render: function(body){
    var zones = field(body, { label:'時差', unit:'時間', value:9, hint:'例: 日本とアメリカ西海岸は約17時間、日本とハワイは約19時間(または-5時間)です。' });
    var dir = toggleGroup(body, { label:'移動方向', value:'east', options:[
      { value:'east', label:'東回り(時差が進む)' },
      { value:'west', label:'西回り(時差が戻る)' }
    ], onChange: function(){ calc(); } });
    var box = resultBox(body);
    var actions = document.createElement('div'); body.appendChild(actions);

    function calc(){
      var z = parseFloat(zones.value)||0;
      var rate = dir.value === 'east' ? 1 : 0.5;
      var days = Math.ceil(z * rate);
      box.innerHTML = '<div class="r-label">体内時計が慣れるまでの目安</div><div class="r-main">約 ' + days + ' 日</div>' +
        '<div class="r-sub">一般的に、東回り(時差が進む方向)の移動は西回りより時差ボケが強く出やすいとされています。現地時間に合わせて早めに生活リズムを調整すると回復が早まります。</div>';
      actions.innerHTML = '';
      actionsRow(actions, 'jetlag', TOOLS.jetlag.name, function(){
        return '時差'+z+'時間('+(dir.value==='east'?'東回り':'西回り')+') → 調整目安 約'+days+'日';
      });
    }
    zones.addEventListener('input', calc);
    calc();
  }
};

/* ---------- 5. 年齢別の推奨睡眠時間 ---------- */
var AGE_BANDS = [
  { max:2, label:'1〜2歳', range:'11〜14時間' },
  { max:5, label:'3〜5歳', range:'10〜13時間' },
  { max:13, label:'6〜13歳', range:'9〜11時間' },
  { max:17, label:'14〜17歳', range:'8〜10時間' },
  { max:64, label:'18〜64歳', range:'7〜9時間' },
  { max:999, label:'65歳以上', range:'7〜8時間' }
];
TOOLS.recommend = {
  name:'年齢別の推奨睡眠時間', emoji:'📋', sub:'年齢から、推奨される睡眠時間の目安を表示', color:'#5a9e6b',
  render: function(body){
    var age = field(body, { label:'年齢', unit:'歳', value:30 });
    var box = resultBox(body);
    var actions = document.createElement('div'); body.appendChild(actions);

    function calc(){
      var a = parseFloat(age.value)||0;
      var band = AGE_BANDS.find(function(b){ return a <= b.max; }) || AGE_BANDS[AGE_BANDS.length-1];
      box.innerHTML = '<div class="r-label">' + band.label + 'の推奨睡眠時間</div><div class="r-main">' + band.range + '</div>' +
        '<div class="r-sub">米国国立睡眠財団(National Sleep Foundation)のガイドラインに基づく一般的な目安です。個人差があるため、日中の眠気や体調を見ながら調整してください。</div>';
      actions.innerHTML = '';
      actionsRow(actions, 'recommend', TOOLS.recommend.name, function(){
        return a+'歳('+band.label+') → 推奨睡眠時間 '+band.range;
      });
    }
    age.addEventListener('input', calc);
    calc();
  }
};

/* ---------- 6. カフェインの残存量計算 ---------- */
TOOLS.caffeine = {
  name:'カフェインの残存量計算', emoji:'☕', sub:'摂取量と経過時間から、体内の残存量を算出', color:'#8a5a3a',
  render: function(body){
    var amount = field(body, { label:'摂取したカフェイン量', unit:'mg', value:150, hint:'コーヒー1杯(150ml)で約60〜100mg、缶コーヒーやエナジードリンクは製品表示をご確認ください。' });
    var hours = field(body, { label:'摂取からの経過時間', unit:'時間', value:4, step:'0.5' });
    var box = resultBox(body);
    var actions = document.createElement('div'); body.appendChild(actions);

    function calc(){
      var a = parseFloat(amount.value)||0, h = parseFloat(hours.value)||0;
      var halfLife = 5;
      var remaining = a * Math.pow(0.5, h/halfLife);
      box.innerHTML = '<div class="r-label">体内に残っているカフェイン量(目安)</div><div class="r-main">約 ' + fmt(remaining,0) + ' mg</div>' +
        '<div class="r-sub">カフェインの半減期を約5時間として計算した目安です。個人差が大きく、就寝の6〜8時間前を過ぎたカフェイン摂取は睡眠に影響しやすいとされています。</div>';
      actions.innerHTML = '';
      actionsRow(actions, 'caffeine', TOOLS.caffeine.name, function(){
        return a+'mg 経過'+h+'時間 → 残存量 約'+fmt(remaining,0)+'mg';
      });
    }
    [amount, hours].forEach(function(i){ i.addEventListener('input', calc); });
    calc();
  }
};

/* ---------- 7. スマホ・PCをやめるべき時刻の計算 ---------- */
TOOLS.screentime = {
  name:'スマホ・PCをやめるべき時刻の計算', emoji:'📵', sub:'就寝予定時刻から、画面を見るのをやめる時刻を算出', color:'#5a6bd9',
  render: function(body){
    var bedtime = field(body, { label:'就寝予定時刻', type:'time', value:'23:30' });
    var minutes = field(body, { label:'就寝前に断つ時間', unit:'分', value:60, hint:'ブルーライトの影響を減らすため、就寝の1時間前を目安にする考え方が一般的です。' });
    var box = resultBox(body);
    var actions = document.createElement('div'); body.appendChild(actions);

    function calc(){
      var t = parseTime(bedtime.value);
      var m = parseFloat(minutes.value)||0;
      if(t == null){ box.innerHTML = '<div class="r-sub">時刻を入力してください。</div>'; actions.innerHTML=''; return; }
      var cutoff = formatMinutes(t - m);
      box.innerHTML = '<div class="r-label">画面を見るのをやめたい時刻</div><div class="r-main">' + cutoff + '</div>' +
        '<div class="r-sub">この時刻以降は、スマホ・PC・テレビなどの強い光を避けると入眠しやすくなるとされています。</div>';
      actions.innerHTML = '';
      actionsRow(actions, 'screentime', TOOLS.screentime.name, function(){
        return '就寝'+bedtime.value+'の'+m+'分前 → '+cutoff+'までに画面をオフ';
      });
    }
    [bedtime, minutes].forEach(function(i){ i.addEventListener('input', calc); });
    calc();
  }
};

/* ---------- 8. 睡眠効率の計算 ---------- */
TOOLS.efficiency = {
  name:'睡眠効率の計算', emoji:'📈', sub:'布団にいた時間と実際に眠った時間から、睡眠効率を算出', color:'#4d9a6a',
  render: function(body){
    var inBed = field(body, { label:'布団にいた時間', unit:'分', value:480 });
    var asleep = field(body, { label:'実際に眠っていた時間', unit:'分', value:420 });
    var box = resultBox(body);
    var actions = document.createElement('div'); body.appendChild(actions);

    function calc(){
      var b = parseFloat(inBed.value)||0, a = parseFloat(asleep.value)||0;
      var efficiency = b>0 ? a/b*100 : 0;
      var judge = efficiency >= 85 ? '良好です' : efficiency >= 75 ? 'やや改善の余地があります' : '改善をおすすめします';
      box.innerHTML = '<div class="r-label">睡眠効率</div><div class="r-main">' + fmt(efficiency,1) + ' %</div>' +
        '<div class="r-row"><span>判定</span><b>' + judge + '</b></div>' +
        '<div class="r-sub">睡眠効率は「実際に眠っていた時間 ÷ 布団にいた時間」で計算され、85%以上が良好の目安とされています。低い場合は就寝・起床時刻を見直すことで改善することがあります。</div>';
      actions.innerHTML = '';
      actionsRow(actions, 'efficiency', TOOLS.efficiency.name, function(){
        return '布団'+b+'分 睡眠'+a+'分 → 睡眠効率 '+fmt(efficiency,1)+'%('+judge+')';
      });
    }
    [inBed, asleep].forEach(function(i){ i.addEventListener('input', calc); });
    calc();
  }
};

(function renderGrid(){
  var grid = $('#toolGrid');
  Object.keys(TOOLS).forEach(function(id){
    var t = TOOLS[id];
    var card = document.createElement('button'); card.className = 'card';
    card.style.setProperty('--card-color', t.color);
    card.innerHTML = '<div class="icon-badge">' + t.emoji + '</div><div class="name">' + t.name + '</div><div class="desc">' + t.sub + '</div>';
    card.addEventListener('click', function(){ openTool(id); });
    grid.appendChild(card);
  });
})();

function renderSaved(){
  var host = $('#savedList');
  var list = loadSaved();
  host.innerHTML = '';
  if(!list.length){
    host.innerHTML = '<div class="empty">まだ保存した計算はありません。<br>各ツールの「この結果を保存」から追加できます。</div>';
    return;
  }
  list.forEach(function(item){
    var el = document.createElement('div'); el.className='saved-item';
    var toolColor = TOOLS[item.toolId] ? TOOLS[item.toolId].color : null;
    if(toolColor) el.style.setProperty('--item-color', toolColor);
    var date = new Date(item.ts);
    var dateStr = date.getFullYear() + '/' + (date.getMonth()+1) + '/' + date.getDate() + ' ' +
      String(date.getHours()).padStart(2,'0') + ':' + String(date.getMinutes()).padStart(2,'0');
    el.innerHTML = '<div><div style="font-weight:900;font-size:13px">' + esc(item.toolName) + '</div>' +
      '<div style="font-size:12px;margin-top:3px">' + esc(item.summary) + '</div>' +
      '<div class="meta">' + dateStr + '</div></div>';
    var del = document.createElement('button'); del.className='del'; del.textContent='🗑'; del.setAttribute('aria-label','この保存を削除');
    del.addEventListener('click', function(){
      writeSaved(loadSaved().filter(function(x){ return x.id !== item.id; }));
      renderSaved();
    });
    el.appendChild(del);
    host.appendChild(el);
  });
}
