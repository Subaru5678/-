<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a211e"/>
      <stop offset="1" stop-color="#14100f"/>
    </linearGradient>
    <linearGradient id="spoon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9478"/>
      <stop offset="1" stop-color="#ff6b4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#ff6b4a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff6b4a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="512" height="512" rx="104"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <g fill="#ff6b4a" fill-opacity="0.08">
      <circle cx="70" cy="80" r="6"/><circle cx="150" cy="80" r="6"/><circle cx="230" cy="80" r="6"/><circle cx="310" cy="80" r="6"/><circle cx="390" cy="80" r="6"/><circle cx="470" cy="80" r="6"/>
      <circle cx="70" cy="180" r="6"/><circle cx="150" cy="180" r="6"/><circle cx="230" cy="180" r="6"/><circle cx="310" cy="180" r="6"/><circle cx="390" cy="180" r="6"/><circle cx="470" cy="180" r="6"/>
      <circle cx="70" cy="420" r="6"/><circle cx="150" cy="420" r="6"/><circle cx="230" cy="420" r="6"/><circle cx="310" cy="420" r="6"/><circle cx="390" cy="420" r="6"/><circle cx="470" cy="420" r="6"/>
    </g>
    <circle cx="256" cy="230" r="230" fill="url(#glow)"/>

    <!-- measuring spoon: bowl + handle -->
    <g transform="rotate(-32 256 256)">
      <rect x="228" y="240" width="26" height="170" rx="13" fill="url(#spoon)"/>
      <ellipse cx="241" cy="180" rx="70" ry="58" fill="url(#spoon)"/>
      <ellipse cx="241" cy="180" rx="44" ry="34" fill="#14100f" fill-opacity="0.28"/>
    </g>

    <!-- droplet accent -->
    <circle cx="368" cy="360" r="44" fill="#6bc9a0"/>
    <circle cx="368" cy="360" r="44" fill="none" stroke="#14100f" stroke-width="8"/>
  </g>
</svg>
