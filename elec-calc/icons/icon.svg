<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#332c14"/>
      <stop offset="1" stop-color="#1c170a"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5cc6a"/>
      <stop offset="1" stop-color="#e0a83f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#e0a83f" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#e0a83f" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="512" height="512" rx="104"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="230" r="230" fill="url(#glow)"/>

    <polygon points="290,110 170,290 240,290 220,400 350,200 275,200" fill="url(#bolt)"/>
    <circle cx="130" cy="150" r="14" fill="#4a7fc9"/>
    <circle cx="380" cy="360" r="14" fill="#4a7fc9"/>
  </g>
</svg>
