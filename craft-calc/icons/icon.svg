<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2530"/>
      <stop offset="1" stop-color="#1c1318"/>
    </linearGradient>
    <linearGradient id="yarn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e589b0"/>
      <stop offset="1" stop-color="#c9598a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#c9598a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c9598a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="512" height="512" rx="104"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="230" r="230" fill="url(#glow)"/>

    <!-- yarn ball -->
    <circle cx="230" cy="230" r="110" fill="url(#yarn)"/>
    <path d="M140 190 C220 150 280 260 340 220" fill="none" stroke="#1c1318" stroke-opacity="0.2" stroke-width="8"/>
    <path d="M130 250 C210 300 270 180 350 260" fill="none" stroke="#1c1318" stroke-opacity="0.2" stroke-width="8"/>
    <path d="M160 150 C240 190 220 300 300 300" fill="none" stroke="#1c1318" stroke-opacity="0.2" stroke-width="8"/>

    <!-- needle -->
    <rect x="320" y="270" width="130" height="14" rx="7" fill="#5a8fc9" transform="rotate(35 320 270)"/>

    <circle cx="368" cy="368" r="40" fill="#c9a13f"/>
    <circle cx="368" cy="368" r="40" fill="none" stroke="#1c1318" stroke-width="8"/>
  </g>
</svg>
