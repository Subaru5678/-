<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2620"/>
      <stop offset="1" stop-color="#16130f"/>
    </linearGradient>
    <linearGradient id="env" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ddb673"/>
      <stop offset="1" stop-color="#b8863f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#b8863f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#b8863f" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="512" height="512" rx="104"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="230" r="230" fill="url(#glow)"/>

    <!-- envelope -->
    <rect x="106" y="140" width="300" height="220" rx="12" fill="url(#env)"/>
    <path d="M106 152 L256 280 L406 152" fill="none" stroke="#16130f" stroke-opacity="0.25" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- mizuhiki bow -->
    <g transform="translate(256 250)">
      <ellipse cx="-34" cy="0" rx="34" ry="20" fill="none" stroke="#8a4a56" stroke-width="9" transform="rotate(-18)"/>
      <ellipse cx="34" cy="0" rx="34" ry="20" fill="none" stroke="#8a4a56" stroke-width="9" transform="rotate(18)"/>
      <circle cx="0" cy="0" r="10" fill="#8a4a56"/>
    </g>

    <circle cx="368" cy="360" r="44" fill="#4d9a53"/>
    <circle cx="368" cy="360" r="44" fill="none" stroke="#16130f" stroke-width="8"/>
  </g>
</svg>
