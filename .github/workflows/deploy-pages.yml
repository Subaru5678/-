name: Deploy diy-calc to GitHub Pages

on:
  push:
    branches: [claude/revenue-app-idea-m4880t]
    paths: ["diy-calc/**"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: diy-calc
      - id: deployment
        uses: actions/deploy-pages@v4
