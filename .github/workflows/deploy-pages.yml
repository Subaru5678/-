name: Deploy apps to GitHub Pages

on:
  push:
    branches: [claude/revenue-app-idea-m4880t]
    paths:
      - "diy-calc/**"
      - "cooking-calc/**"
      - "moving-calc/**"
      - "gift-calc/**"
      - "pet-calc/**"
      - "garden-calc/**"
      - "craft-calc/**"
      - "gym-calc/**"
      - "clean-calc/**"
      - "camp-calc/**"
      - "sleep-calc/**"
      - "photo-calc/**"
      - "savings-calc/**"
      - "car-calc/**"
      - "run-calc/**"
      - "elec-calc/**"
      - "study-calc/**"
      - "budget-calc/**"
      - "coffee-calc/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r diy-calc/. _site/
          for app in cooking-calc moving-calc gift-calc pet-calc garden-calc craft-calc gym-calc clean-calc camp-calc sleep-calc photo-calc savings-calc car-calc run-calc elec-calc study-calc budget-calc coffee-calc; do
            mkdir -p "_site/$app"
            cp -r "$app/." "_site/$app/"
          done
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
