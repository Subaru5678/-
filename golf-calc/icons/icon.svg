<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183320"/>
      <stop offset="1" stop-color="#0e1c13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#3f8f4a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3f8f4a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="512" height="512" rx="104"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="220" r="230" fill="url(#glow)"/>

    <line x1="200" y1="140" x2="260" y2="380" stroke="#c9a13f" stroke-width="10" stroke-linecap="round"/>
    <circle cx="308" cy="150" r="46" fill="#ffffff"/>
    <circle cx="296" cy="138" r="4" fill="#c8d0c8"/>
    <circle cx="316" cy="140" r="4" fill="#c8d0c8"/>
    <circle cx="306" cy="158" r="4" fill="#c8d0c8"/>
    <circle cx="322" cy="160" r="4" fill="#c8d0c8"/>

    <ellipse cx="256" cy="400" rx="140" ry="20" fill="#3f8f4a"/>
    <circle cx="256" cy="400" r="10" fill="#0e1c13"/>
  </g>
</svg>
