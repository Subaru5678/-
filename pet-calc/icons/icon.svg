<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#245049"/>
      <stop offset="1" stop-color="#12211e"/>
    </linearGradient>
    <linearGradient id="paw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fc4b8"/>
      <stop offset="1" stop-color="#3a9188"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#3a9188" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3a9188" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="512" height="512" rx="104"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="230" r="230" fill="url(#glow)"/>

    <!-- paw print -->
    <g fill="url(#paw)">
      <ellipse cx="256" cy="300" rx="95" ry="75"/>
      <ellipse cx="150" cy="200" rx="38" ry="46" transform="rotate(-18 150 200)"/>
      <ellipse cx="230" cy="150" rx="38" ry="48" transform="rotate(-6 230 150)"/>
      <ellipse cx="320" cy="150" rx="38" ry="48" transform="rotate(6 320 150)"/>
      <ellipse cx="390" cy="205" rx="36" ry="44" transform="rotate(20 390 205)"/>
    </g>

    <circle cx="368" cy="368" r="44" fill="#e0834f"/>
    <circle cx="368" cy="368" r="44" fill="none" stroke="#12211e" stroke-width="8"/>
  </g>
</svg>
