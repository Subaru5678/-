<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#382020"/>
      <stop offset="1" stop-color="#1c1010"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ee7a7a"/>
      <stop offset="1" stop-color="#d94f4f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#d94f4f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d94f4f" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="512" height="512" rx="104"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="230" r="230" fill="url(#glow)"/>

    <!-- barbell -->
    <rect x="80" y="245" width="352" height="20" rx="10" fill="url(#bar)"/>
    <rect x="100" y="190" width="30" height="130" rx="8" fill="url(#bar)"/>
    <rect x="140" y="205" width="24" height="100" rx="8" fill="url(#bar)"/>
    <rect x="382" y="190" width="30" height="130" rx="8" fill="url(#bar)"/>
    <rect x="348" y="205" width="24" height="100" rx="8" fill="url(#bar)"/>

    <circle cx="368" cy="368" r="40" fill="#3f6fc9"/>
    <circle cx="368" cy="368" r="40" fill="none" stroke="#1c1010" stroke-width="8"/>
  </g>
</svg>
